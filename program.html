<script>
Inaya.boot(async function (s) {
  var slug = decodeURIComponent(location.pathname.replace(/\/+$/, "").split("/").pop() || "");
  var programs = await Inaya.loadPrograms();
  var p = programs.filter(function (x) { return x.slug === slug; })[0];
  var main = document.getElementById("main");
  if (!p) {
    main.innerHTML = '<section class="section"><div class="container center"><h1>Program not found</h1><p class="lead" style="margin:0 auto 1.4rem">This program may have moved or is not published yet.</p><a class="btn" href="/programs">See all programs</a></div></section>';
    document.title = "Program not found | " + s.academy_name;
    var m = document.createElement("meta"); m.name = "robots"; m.content = "noindex"; document.head.appendChild(m);
    return;
  }
  main.innerHTML = InayaSections.programDetail(p, { settings: s });
  Inaya.setMeta({ title: p.title + " | " + s.academy_name, description: p.short_description || p.description.slice(0, 155), image: p.image_url || s.og_image, siteUrl: s.site_url, canonical: s.site_url.replace(/\/+$/, "") + "/programs/" + p.slug });
});
</script>
